<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141b26"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#00d4ff"/>
      <stop offset="85%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#263042" stroke-width="12"/>
  <!-- Target -14 LUFS dashed line -->
  <line x1="72" y1="176" x2="440" y2="176" stroke="#10b981" stroke-width="6" stroke-dasharray="14 10" opacity="0.8"/>
  <!-- Loudness Bars -->
  <rect x="96" y="240" width="52" height="176" rx="10" fill="url(#barCyan)" opacity="0.75"/>
  <rect x="172" y="160" width="52" height="256" rx="10" fill="url(#barCyan)"/>
  <rect x="248" y="196" width="52" height="220" rx="10" fill="url(#barCyan)" opacity="0.9"/>
  <!-- True Peak L/R Bars -->
  <rect x="336" y="124" width="32" height="292" rx="8" fill="#3b82f6"/>
  <rect x="384" y="140" width="32" height="276" rx="8" fill="#3b82f6"/>
  <!-- Clip LEDs -->
  <rect x="336" y="96" width="32" height="16" rx="5" fill="#ef4444"/>
  <rect x="384" y="96" width="32" height="16" rx="5" fill="#10b981"/>
</svg>
